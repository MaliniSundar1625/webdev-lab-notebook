<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Layout Exercise 04 - CSS Grid Areas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="areas-container">
      <h1>CSS Layout Exercise 04 - CSS Grid Areas</h1>
      <header class="grid-item area-header">Header</header>
      <article class="grid-item area-article">Article</article>
      <aside class="grid-item area-aside">Aside</aside>
      <section class="grid-item area-section">Section</section>
      <footer class="grid-item area-footer">Footer</footer>
    </main>
  </body>
</html>
