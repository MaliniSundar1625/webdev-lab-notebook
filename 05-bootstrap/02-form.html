<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <main>
      <div class="container my-4">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
              <div class="card-body px-4 pt-5 pb-4">
                <h1 class="text-center mb-4 fs-2">Roth IRA Calculator</h1>

                <form>
                  <!-- Balance -->
                  <div class="row mb-3">
                    <label for="balance" class="col-md-5 col-form-label">
                      Balance ($)
                    </label>
                    <div class="col-md-7">
                      <input
                        type="text"
                        class="form-control"
                        id="balance"
                        name="balance"
                      />
                    </div>
                  </div>

                  <!-- Annual Contribution -->
                  <div class="row mb-3">
                    <label for="contribution" class="col-md-5 col-form-label">
                      Annual Contribution ($)
                    </label>
                    <div class="col-md-7">
                      <input
                        type="text"
                        class="form-control"
                        id="contribution"
                        name="contribution"
                      />
                    </div>
                  </div>

                  <!-- Maximize Contributions -->
                  <fieldset class="row mb-3">
                    <legend class="col-md-5 col-form-label pt-0">
                      Maximize contributions?
                    </legend>
                    <div class="col-md-7">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="maximize"
                          id="maximizeYes"
                          value="yes"
                        />
                        <label class="form-check-label" for="maximizeYes"
                          >Yes</label
                        >
                      </div>
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="maximize"
                          id="maximizeNo"
                          value="no"
                        />
                        <label class="form-check-label" for="maximizeNo"
                          >No</label
                        >
                      </div>
                    </div>
                  </fieldset>

                  <!-- Expected Return -->
                  <div class="row mb-3">
                    <label for="expectedReturn" class="col-md-5 col-form-label">
                      Expected return (%)
                    </label>
                    <div class="col-md-7">
                      <input
                        type="number"
                        class="form-control"
                        id="expectedReturn"
                        name="expectedReturn"
                        min="0"
                        step="0.1"
                      />
                    </div>
                  </div>

                  <!-- Current Age -->
                  <div class="row mb-3">
                    <label for="currentAge" class="col-md-5 col-form-label">
                      Current age
                    </label>
                    <div class="col-md-7">
                      <input
                        type="number"
                        class="form-control"
                        id="currentAge"
                        name="currentAge"
                        min="0"
                      />
                    </div>
                  </div>

                  <!-- Retirement Age -->
                  <div class="row mb-3">
                    <label for="retirementAge" class="col-md-5 col-form-label">
                      Retirement age
                    </label>
                    <div class="col-md-7">
                      <input
                        type="number"
                        class="form-control"
                        id="retirementAge"
                        name="retirementAge"
                        min="0"
                      />
                    </div>
                  </div>

                  <!-- Tax Rate -->
                  <div class="row mb-3">
                    <label for="taxRate" class="col-md-5 col-form-label">
                      Tax rate (%)
                    </label>
                    <div class="col-md-7">
                      <input
                        type="number"
                        class="form-control"
                        id="taxRate"
                        name="taxRate"
                        min="0"
                        max="100"
                        step="0.1"
                      />
                    </div>
                  </div>

                  <!-- Buttons -->
                  <div class="d-flex gap-2 mt-3">
                    <button
                      type="submit"
                      class="btn btn-primary"
                      style="flex: 1"
                    >
                      Calculate
                    </button>
                    <button
                      type="reset"
                      class="btn btn-outline-secondary"
                      style="flex: 1"
                    >
                      Reset
                    </button>
                  </div>

                  <!-- Footer note -->
                  <p class="text-muted small mt-3 mb-0">
                    This exercise is a simplified version of the Roth IRA
                    Calculator
                    <a
                      href="https://www.calculator.net/roth-ira-calculator.html"
                      target="_blank"
                      >Calculator.net</a
                    >
                  </p>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
