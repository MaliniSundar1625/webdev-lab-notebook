<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Exercise 04 - Fetch</title>
    <link rel="stylesheet" href="./04-fetch.css" />
  </head>
  <body>
    <main>
      <nav class="navbar" aria-label="Site navigation">
        <h1 class="brand-logo">Pokedex</h1>
        <label class="visually-hidden" for="searchInput">
          Search Pokémon by name or type
        </label>
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search Pokémon..."
        />
      </nav>

      <section id="loader" class="loader-wrapper" aria-label="Loading content">
        <img
          src="./images/loader.gif"
          alt="Animated loading spinner indicating Pokémon data is being fetched"
          class="loader"
        />
        <p>Fetching data...</p>
      </section>

      <section
        id="message"
        class="message hidden"
        aria-label="Search results status"
        aria-live="polite"
        role="status"
      ></section>

      <section
        id="pokemonContainer"
        class="pokemon-container"
        aria-label="Pokémon cards"
        aria-live="polite"
      ></section>
    </main>

    <script src="./fetch.js"></script>
  </body>
</html>
